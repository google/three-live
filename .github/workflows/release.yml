name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build Native CLI Binaries (${{ matrix.target }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: three-live-cli-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            artifact_name: three-live-cli-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: three-live-cli-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: three-live-cli-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: three-live-cli-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Build embedded JS engine asset
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; stable toolchain below
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build with Cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --manifest-path compiler/Cargo.toml --release --bin three-live-cli --target ${{ matrix.target }}

      - name: Build with Cross
        if: ${{ matrix.use_cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --manifest-path compiler/Cargo.toml --release --bin three-live-cli --target ${{ matrix.target }}

      - name: Rename binary to target artifact name
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/three-live-cli.exe" ]; then
            cp "target/${{ matrix.target }}/release/three-live-cli.exe" "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          else
            cp "target/${{ matrix.target }}/release/three-live-cli" "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  build-android:
    name: Build Android AAR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Build embedded JS engine asset
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Keep in sync with gradle/wrapper/gradle-wrapper.properties; see the note in ci.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.7'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26b

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; stable toolchain below
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android AAR
        run: bash scripts/build_android_aar.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Guard against shipping a Java-only AAR: without the cross-compiled .so files every
      # ThreeCompiler call throws UnsatisfiedLinkError at runtime.
      - name: Verify AAR contains native libraries
        run: |
          aar=$(ls mobile/android/build/outputs/aar/*-release.aar)
          echo "Inspecting ${aar}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "${aar}" | grep -q "jni/${abi}/libthree_live_compiler.so" \
              || { echo "::error::AAR is missing jni/${abi}/libthree_live_compiler.so"; exit 1; }
          done
          echo "All three ABIs present."

      # if-no-files-found defaults to 'warn', which previously let this job go green while
      # uploading nothing at all.
      - name: Upload Android AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-compiler-release-aar
          path: mobile/android/build/outputs/aar/*-release.aar
          if-no-files-found: error

      # Optional Android adapter modules are pure Kotlin on top of the core AAR.
      - name: Build optional Android adapter AARs
        run: >
          gradle
          :mobile:android-filament:assembleRelease
          :mobile:android-firebase-ai:assembleRelease
          :mobile:android-detect-mlkit:assembleRelease
          :mobile:android-hands-androidxr:assembleRelease
          :mobile:android-hands-mediapipe:assembleRelease
          --stacktrace

      - name: Upload Filament renderer AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-filament-release-aar
          path: mobile/android-filament/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload Firebase AI adapter AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-firebase-ai-release-aar
          path: mobile/android-firebase-ai/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload ML Kit detector AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-detect-mlkit-release-aar
          path: mobile/android-detect-mlkit/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload Android XR hands AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-hands-androidxr-release-aar
          path: mobile/android-hands-androidxr/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload MediaPipe hands AAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-live-hands-mediapipe-release-aar
          path: mobile/android-hands-mediapipe/build/outputs/aar/*-release.aar
          if-no-files-found: error

      # Always validate POMs and publication wiring against mavenLocal, publish to GitHub Packages
      # Maven using GITHUB_TOKEN, and publish to Maven Central if Sonatype credentials are set.
      - name: Publish Android AARs to Maven Local
        run: >
          gradle
          :mobile:android:publishReleasePublicationToMavenLocal
          :mobile:android-filament:publishReleasePublicationToMavenLocal
          :mobile:android-firebase-ai:publishReleasePublicationToMavenLocal
          :mobile:android-detect-mlkit:publishReleasePublicationToMavenLocal
          :mobile:android-hands-androidxr:publishReleasePublicationToMavenLocal
          :mobile:android-hands-mediapipe:publishReleasePublicationToMavenLocal
          --stacktrace

      - name: Publish Android AARs to GitHub Packages Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle \
            :mobile:android:publishReleasePublicationToGitHubPackagesRepository \
            :mobile:android-filament:publishReleasePublicationToGitHubPackagesRepository \
            :mobile:android-firebase-ai:publishReleasePublicationToGitHubPackagesRepository \
            :mobile:android-detect-mlkit:publishReleasePublicationToGitHubPackagesRepository \
            :mobile:android-hands-androidxr:publishReleasePublicationToGitHubPackagesRepository \
            :mobile:android-hands-mediapipe:publishReleasePublicationToGitHubPackagesRepository \
            --stacktrace || echo "::notice::GitHub Packages Maven publish skipped or version already exists."

      - name: Publish Android AARs to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_REPO_URL: ${{ secrets.MAVEN_CENTRAL_REPO_URL }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ]; then
            echo "::notice::MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD secrets are not configured yet; skipping Maven Central publish."
            exit 0
          fi
          gradle \
            :mobile:android:publishReleasePublicationToMavenCentralRepository \
            :mobile:android-filament:publishReleasePublicationToMavenCentralRepository \
            :mobile:android-firebase-ai:publishReleasePublicationToMavenCentralRepository \
            :mobile:android-detect-mlkit:publishReleasePublicationToMavenCentralRepository \
            :mobile:android-hands-androidxr:publishReleasePublicationToMavenCentralRepository \
            :mobile:android-hands-mediapipe:publishReleasePublicationToMavenCentralRepository \
            --stacktrace

  build-ios:
    name: Build Apple XCFramework
    if: github.event_name == 'push'
    runs-on: macos-latest
    outputs:
      checksum: ${{ steps.package_xcframework.outputs.checksum }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Build embedded JS engine asset
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; stable toolchain below
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build XCFramework
        run: bash scripts/build_ios_xcframework.sh

      - name: Verify XCFramework completeness
        run: bash scripts/verify_xcframework.sh mobile/ios/ThreeLiveCompiler.xcframework

      - name: Zip XCFramework & Compute Checksum
        id: package_xcframework
        run: |
          cd mobile/ios
          zip -r -y ThreeLiveCompiler.xcframework.zip ThreeLiveCompiler.xcframework
          CHECKSUM=$(swift package compute-checksum ThreeLiveCompiler.xcframework.zip)
          echo "XCFramework SHA-256 Checksum: ${CHECKSUM}"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ThreeLiveCompiler.xcframework.zip
          path: mobile/ios/ThreeLiveCompiler.xcframework.zip
          if-no-files-found: error


  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Build Web JS bundles
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Stage Release Assets
        run: |
          mkdir -p dist-release web-bundle/three-live web-bundle/xr-live
          find release-artifacts -type f -exec cp {} dist-release/ \;
          cp dist/*.js dist/*.min.js dist/three-live-sandbox.html web-bundle/
          cp three-live/dist/*.js three-live/dist/*.min.js three-live/dist/*.cjs three-live/dist/*.d.ts web-bundle/three-live/
          cp xr-live/dist/*.js xr-live/dist/*.min.js xr-live/dist/*.cjs xr-live/dist/*.d.ts web-bundle/xr-live/
          (cd web-bundle && zip -r ../dist-release/three-live-web-dist.zip .)
          cp dist/three-live.min.js dist/three-live-viewer.min.js dist/three-live-studio.min.js dist/three-live-cad.min.js dist/three-live-animation.min.js dist/three-live-sandbox.html dist-release/
          cp three-live/dist/three-live-full.min.js dist-release/
          cp xr-live/dist/xr-live.min.js xr-live/dist/xr-live-viewer.min.js xr-live/dist/xr-live-sensors.min.js xr-live/dist/xr-live-spatial.min.js xr-live/dist/xr-live-sim.min.js xr-live/dist/xr-live-full.min.js dist-release/
          ls -la dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Install dependencies & build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish three-live monorepo packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          else
            npm install -g npm@latest || true
          fi
          for ws in three-live xr-live; do
            pkg_version="$(node -p "require('./${ws}/package.json').version")"
            if npm view "${ws}@${pkg_version}" version >/dev/null 2>&1; then
              echo "::notice::${ws}@${pkg_version} is already published on npm; skipping."
              continue
            fi
            if [ -n "${NPM_TOKEN:-}" ]; then
              npm publish --workspace="${ws}" --access public --provenance || npm publish --workspace="${ws}" --access public
            else
              npm publish --workspace="${ws}" --access public --provenance || {
                echo "::notice::npm OIDC Trusted Publishing failed for ${ws}@${pkg_version}."
                exit 0
              }
            fi
          done

  publish-mcp-registry:
    name: Publish Official MCP Registry
    runs-on: ubuntu-latest
    needs: [publish-npm]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mcp-publisher and publish server.json via GitHub OIDC
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json || echo "::notice::server.json version may already be published on the Official MCP Registry."

  publish-crates:
    name: Publish Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Build embedded JS engine asset
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; stable toolchain below
        with:
          toolchain: stable

      - name: Cargo Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CRATES_IO_TOKEN secret is not configured yet; skipping crates.io publish."
            exit 0
          fi
          cargo publish --manifest-path compiler/Cargo.toml --allow-dirty || {
            echo "::notice::cargo publish exited non-zero (version may already be published on crates.io)."
            exit 0
          }

  # The SHA-256 of a release artifact cannot be known until the artifact exists, so the
  # manifest committed on the tag is necessarily stale. This pins the real values and moves
  # the tag to the corrected commit. Without this, `.binaryTarget(url:checksum:)` would keep
  # the placeholder checksum and no external consumer could resolve the package at all.
  pin-spm-manifest:
    name: Pin SPM Binary Target
    runs-on: ubuntu-latest
    needs: [build-ios, github-release]
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin release tag and checksum into Package.swift
        env:
          TAG: ${{ github.ref_name }}
          CHECKSUM: ${{ needs.build-ios.outputs.checksum }}
        run: bash scripts/update_spm_binary_target.sh "${TAG}" "${CHECKSUM}"

      - name: Commit, move tag, and update main
        env:
          TAG: ${{ github.ref_name }}
          CHECKSUM: ${{ needs.build-ios.outputs.checksum }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Package.swift; then
            echo "Package.swift is already pinned for ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: pin ThreeLiveCompiler.xcframework checksum for ${TAG}"
          git tag -f "${TAG}"
          git push --force origin "refs/tags/${TAG}"

          # Also update Package.swift on main so main carries the latest release checksum
          git fetch origin main
          git checkout -B main origin/main
          bash scripts/update_spm_binary_target.sh "${TAG}" "${CHECKSUM}"
          if ! git diff --quiet -- Package.swift; then
            git add Package.swift
            git commit -m "chore: pin ThreeLiveCompiler.xcframework checksum for ${TAG} [skip ci]"
            git push origin HEAD:refs/heads/main || echo "::warning::Could not push Package.swift update to main"
          fi

  # End-to-end proof that the published package is installable. This resolves the release
  # over the network, verifies the binary target checksum, links the XCFramework, and runs
  # the compiler -- the exact path an external user takes.
  verify-spm-consumption:
    name: Verify SPM Consumption
    runs-on: macos-latest
    needs: [pin-spm-manifest]
    steps:
      - name: Resolve and run the published package as an external consumer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/google/three-live/releases/download/${TAG}/ThreeLiveCompiler.xcframework.zip"
          if ! curl -fsSLI "${ASSET_URL}" >/dev/null 2>&1; then
            echo "::notice::Release asset ${ASSET_URL} is not anonymously reachable yet (repository is currently private). Unauthenticated SwiftPM consumption probe will run once the repository is public."
            exit 0
          fi

          VERSION="${TAG#v}"
          WORKDIR="$(mktemp -d)"
          mkdir -p "${WORKDIR}/Sources/ConsumerProbe"
          cd "${WORKDIR}"

          cat > Sources/ConsumerProbe/main.swift <<'SWIFT'
          import Foundation
          import ThreeLiveCompiler

          let script = """
          const mesh = new THREE.Mesh(
              new THREE.BoxGeometry(1, 1, 1),
              new THREE.MeshStandardMaterial({ color: 0xffffff })
          );
          scene.add(mesh);
          """

          let glb = try ThreeCompiler.compileSync(script)
          guard Array(glb.prefix(4)) == [0x67, 0x6C, 0x54, 0x46] else {
              fatalError("Resolved package did not produce a valid GLB container")
          }
          print("Consumed ThreeLiveCompiler successfully: \(glb.count) bytes of GLB")
          SWIFT

          cat > Package.swift <<MANIFEST
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "ConsumerProbe",
              platforms: [.macOS(.v12)],
              dependencies: [
                  .package(url: "https://github.com/google/three-live.git", exact: "${VERSION}")
              ],
              targets: [
                  .executableTarget(
                      name: "ConsumerProbe",
                      dependencies: [.product(name: "ThreeLiveCompiler", package: "three-live")]
                  )
              ]
          )
          MANIFEST

          swift run



