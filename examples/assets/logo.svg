<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c17"/>
    </linearGradient>
    <linearGradient id="tl-top" x1="64" y1="18" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tl-left" x1="22" y1="42" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tl-right" x1="106" y1="42" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tl-bg)" stroke="#334155" stroke-width="3"/>
  <!-- Outer isometric prism -->
  <polygon points="64,18 106,42 64,66 22,42" fill="url(#tl-top)"/>
  <polygon points="22,42 64,66 64,110 22,86" fill="url(#tl-left)"/>
  <polygon points="106,42 106,86 64,110 64,66" fill="url(#tl-right)"/>
  <!-- Inner live cutout / spatial axes -->
  <polygon points="64,34 88,48 64,62 40,48" fill="#0b1120" fill-opacity="0.45"/>
  <polyline points="64,18 64,66 22,86" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65"/>
  <line x1="64" y1="66" x2="106" y2="86" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65"/>
  <circle cx="64" cy="66" r="5.5" fill="#f8fafc"/>
</svg>
