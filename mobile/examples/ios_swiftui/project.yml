#
# XcodeGen project definition for the Three-Live iOS and tvOS demos.
#
# The .xcodeproj and Info.plist are generated rather than committed, so that this file stays
# the single reviewable source of truth for the app's configuration:
#
#     brew install xcodegen
#     xcodegen generate
#     open ThreeLiveDemo.xcodeproj

name: ThreeLiveDemo

options:
  bundleIdPrefix: com.google.threelive
  deploymentTarget:
    iOS: '15.0'
    # RealityKit first shipped on tvOS in tvOS 26.
    tvOS: '26.0'
  createIntermediateGroups: true

packages:
  ThreeLiveCompiler:
    # The repository root, which is where Package.swift lives. Building the demo therefore
    # exercises the same manifest that external consumers resolve.
    path: ../../..

# The iOS and tvOS apps compile the same folder; each Swift file is gated to its platform.
targetTemplates:
  DemoApp:
    type: application
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Info.plist
          - InfoTV.plist
          - UITests
          - .build
          - '*.xcodeproj'
    dependencies:
      - package: ThreeLiveCompiler
        product: ThreeLiveCompiler
    settings:
      base:
        SWIFT_VERSION: '5.9'
        ENABLE_USER_SCRIPT_SANDBOXING: 'NO'

targets:
  ThreeLiveDemo:
    templates: [DemoApp]
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Three-Live
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required. AR Quick Look uses the device camera to place models in the real world,
        # and Apple rejects submissions that reach the camera without a purpose string.
        NSCameraUsageDescription: >-
          Three-Live uses the camera to place your compiled 3D models into the room around
          you with AR Quick Look.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.threelive.demo
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: 'NO'
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: 'NO'
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: ''

  # Apple TV demo (TVContentView.swift): the same presets, explored with the Siri Remote.
  ThreeLiveDemoTV:
    templates: [DemoApp]
    platform: tvOS
    scheme:
      testTargets:
        - ThreeLiveDemoTVUITests
    info:
      path: InfoTV.plist
      properties:
        CFBundleDisplayName: Three-Live
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.threelive.demo.tv
        TARGETED_DEVICE_FAMILY: '3'
        CODE_SIGNING_ALLOWED[sdk=appletvsimulator*]: 'NO'
        CODE_SIGNING_REQUIRED[sdk=appletvsimulator*]: 'NO'
        CODE_SIGN_IDENTITY[sdk=appletvsimulator*]: ''

  # Drives the Apple TV demo with the simulated Siri Remote (XCUIRemote).
  ThreeLiveDemoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: ThreeLiveDemoTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.threelive.demo.tv.uitests
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: 'YES'
        TARGETED_DEVICE_FAMILY: '3'
