[package]
name = "three-live-compiler"
version = "1.3.2"
edition = "2021"
description = "High-performance procedural Three.js to binary glTF 2.0 (GLB) compiler powered by Boa"
license = "Apache-2.0"
repository = "https://github.com/google/three-live"
homepage = "https://google.github.io/three-live/"
include = [
    "src/**/*",
    "include/**/*",
    "build.rs",
    "assets/three-author-engine.min.js",
    "Cargo.toml",
]

[[bin]]
name = "three-live-cli"
path = "src/main.rs"
# `src/main.rs` uses `clap`, which is only pulled in by the `cli` feature. Without
# this, `--no-default-features` builds (e.g. wasm32) still try to compile the binary
# and fail on the missing import.
required-features = ["cli"]

[lib]
name = "three_live_compiler"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Use enum-based JsValueInner (`jsvalue-enum`) instead of 48-bit NaN-boxing so heap
# pointers with ARM64 Top-Byte Ignore (TBI) / MTE tags on Android 11+ (`0xb400...`)
# or 5-level paging (LA57) do not trip Boa's 48-bit pointer mask assertion.
boa_engine = { version = "0.21", features = ["jsvalue-enum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Raw DEFLATE for playground scene links (`scene_link.rs`).
miniz_oxide = "0.8"
clap = { version = "4.4", features = ["derive"], optional = true }
jni = { version = "0.21", optional = true }

# Unconditional on wasm32 rather than feature-gated: `src/time.rs` needs `Date.now()`
# on that target no matter which features are selected, because
# `std::time::Instant::now()` panics there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Transitive dependency of `boa_engine`. Since 0.3 it refuses to build for
# `wasm32-unknown-unknown` unless the top-level crate names a backend, so it has to be
# declared here even though we never call it directly. Also requires
# `RUSTFLAGS='--cfg getrandom_backend="wasm_js"'`; see `build_wasm.sh`.
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["cli"]
cli = ["dep:clap"]
# Retained as a no-op marker so existing `--features wasm` invocations keep working.
# The wasm module and its bindings are now selected by `target_arch` directly.
wasm = []
jni = ["dep:jni"]

[dev-dependencies]
serde_json = "1.0"


